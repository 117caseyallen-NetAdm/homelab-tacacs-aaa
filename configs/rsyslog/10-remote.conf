# /etc/rsyslog.d/10-remote.conf
#
# Receive device syslog on UDP and TCP 514. One directory per device, one file
# per day, so four vendors' formats never share a file.
#
# The privileged-port bind works inside an unprivileged LXC: rsyslog binds as
# root before dropping privileges.
#
# UDP syslog has no authentication and no encryption — anything on the
# management VLAN can forge an entry from any hostname.

module(load="imudp")
input(type="imudp" port="514")
module(load="imtcp")
input(type="imtcp" port="514")

$template RemoteHost,"/var/log/network/%HOSTNAME%/%$YEAR%-%$MONTH%-%$DAY%.log"
:fromhost-ip, !isequal, "127.0.0.1" -?RemoteHost
& stop
