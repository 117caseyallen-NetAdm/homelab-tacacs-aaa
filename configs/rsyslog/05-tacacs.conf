# /etc/rsyslog.d/05-tacacs.conf
#
# tac_plus-ng accounting arrives over the local syslog socket, so its source is
# 127.0.0.1 — which the remote-host rule in 10-remote.conf deliberately
# excludes. Route it on the program name instead, set by "syslog ident" in
# tac_plus-ng.cfg. Numbered 05- so rsyslog evaluates it first.

if $programname == 'tac_plus-ng' then /var/log/network/tacacs-accounting.log
& stop
